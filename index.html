<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polymarket Trends Unified Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="main.js" defer></script>
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <header class="hero">
    <p class="kicker">Unified Main Repository</p>
    <h1>Polymarket Trends</h1>
    <p class="subtitle">聚合市场热度、概率与流动性，快速识别当日主线事件。</p>
    <div class="hero-meta">
      <span id="data-status">准备加载数据…</span>
      <span id="last-updated">最后更新：-</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel controls-panel">
      <h2>控制面板</h2>
      <div class="controls-grid">
        <label>
          排序方式
          <select id="sort-select">
            <option value="heat">按热度指数</option>
            <option value="volume">按成交量</option>
            <option value="yesHigh">按 Yes 概率高到低</option>
            <option value="yesLow">按 Yes 概率低到高</option>
          </select>
        </label>
        <label>
          显示条目
          <select id="limit-select">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
          </select>
        </label>
        <label>
          最小成交量
          <input id="min-volume" type="range" min="0" max="10000000" step="50000" value="0">
          <span id="min-volume-value">0</span>
        </label>
      </div>
      <div class="controls-row">
        <label class="checkbox">
          <input id="auto-refresh-toggle" type="checkbox" checked>
          自动刷新（5分钟）
        </label>
        <button id="refresh-btn" type="button">立即刷新</button>
      </div>
    </section>

    <section class="panel summary-panel">
      <h2>趋势摘要</h2>
      <p id="summary-text">加载中…</p>
      <div class="stats-grid">
        <div class="stat">
          <p class="stat-label">样本市场数</p>
          <p id="stat-count" class="stat-value">-</p>
        </div>
        <div class="stat">
          <p class="stat-label">总成交量</p>
          <p id="stat-volume" class="stat-value">-</p>
        </div>
        <div class="stat">
          <p class="stat-label">平均 Yes</p>
          <p id="stat-yes" class="stat-value">-</p>
        </div>
      </div>
    </section>

    <section class="panel chart-panel">
      <h2>热度指数分布</h2>
      <canvas id="trendChart" aria-label="Polymarket heat chart"></canvas>
    </section>

    <section class="panel table-panel">
      <h2>热门市场</h2>
      <div class="table-wrap">
        <table id="market-table">
          <thead>
            <tr>
              <th>#</th>
              <th>事件</th>
              <th>Yes</th>
              <th>No</th>
              <th>成交量</th>
              <th>流动性</th>
              <th>热度</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>数据来源：<a href="https://polymarket.com/" target="_blank" rel="noopener noreferrer">Polymarket / Gamma API</a></p>
  </footer>
</body>
</html>
